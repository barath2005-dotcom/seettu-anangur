name: Build Mobile Apps (Android APK & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: |
          npm run build:shared
          npm --workspace=@seettu/web run build

      - name: Sync Web Assets to Android
        working-directory: apps/web
        run: |
          mkdir -p ~/.config/capacitor
          echo '{"telemetry":false}' > ~/.config/capacitor/sysconfig.json
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json 2>/dev/null || true
          npx cap sync android --no-color || true

      - name: Build Android APK (Debug)
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sri-Pattanathu-Mariamman-Android-APK
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v1.0.0
          name: "Sri Pattanathu Mariamman Mobile App v1.0.0"
          body: |
            Official Mobile App for Sri Pattanathu Mariamman Anangur Seettu Kuzhu.
            - Direct Android APK attached below (`app-debug.apk`).
            - iOS users can install via Safari -> Add to Home Screen from https://seettu-anangur.vercel.app.
          files: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Prepare & Verify iOS Project
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: |
          npm run build:shared
          npm --workspace=@seettu/web run build

      - name: Sync Web Assets to iOS
        working-directory: apps/web
        run: |
          mkdir -p ~/Library/Preferences/capacitor
          echo '{"telemetry":false}' > ~/Library/Preferences/capacitor/sysconfig.json
          mkdir -p ios/App/App/public
          cp -r dist/* ios/App/App/public/
          cp capacitor.config.json ios/App/App/capacitor.config.json 2>/dev/null || true
          npx cap sync ios --no-color || true

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sri-Pattanathu-Mariamman-iOS-XcodeProject
          path: apps/web/ios
          retention-days: 30

