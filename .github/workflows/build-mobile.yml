name: Build Mobile Apps (Android APK & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: |
          npm run build:shared
          npm --workspace=@seettu/web run build

      - name: Sync Capacitor Android
        working-directory: apps/web
        run: npx cap sync android

      - name: Build Android APK (Debug)
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Sri-Pattanathu-Mariamman-Android-APK
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-ios:
    name: Prepare & Verify iOS Project
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: |
          npm run build:shared
          npm --workspace=@seettu/web run build

      - name: Sync Capacitor iOS
        working-directory: apps/web
        run: npx cap sync ios

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sri-Pattanathu-Mariamman-iOS-XcodeProject
          path: apps/web/ios
          retention-days: 30
