<!DOCTYPE html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ஸ்ரீ பட்டணத்து மாரியம்மன் ஆனங்கூர் சீட்டு குழு</title>
    
    <!-- PWA & Mobile Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#07142A" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Apple iOS Standalone Mobile App Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="சீட்டு குழு" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.jpg" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0E0306] text-[#1A0B0E] antialiased">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; background: #0E0306; color: white; padding: 24px; font-family: 'Inter', system-ui, -apple-system, sans-serif; box-sizing: border-box; user-select: none;">
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding-top: 28px;">
          <span style="font-size: 11px; font-weight: 700; color: #FDE68A; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.85;">அதிகாரப்பூர்வ செயலி</span>
          <span style="padding: 4px 10px; border-radius: 9999px; font-size: 10px; font-weight: 900; background: rgba(255,255,255,0.1); color: #FDE68A; border: 1px solid rgba(245,158,11,0.3);">v1.0.2</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 360px; margin: auto;">
          <div style="width: 96px; height: 96px; border-radius: 24px; border: 2px solid rgba(245,158,11,0.8); background: rgba(245,158,11,0.15); box-shadow: 0 0 35px rgba(245,158,11,0.35); padding: 4px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
            <img src="/logo.jpg" alt="Logo" style="width: 100%; height: 100%; border-radius: 20px; object-fit: cover;" />
          </div>
          <h1 style="font-size: 20px; font-weight: 900; margin: 0; line-height: 1.3; color: #FFFFFF;">ஸ்ரீ பட்டணத்து மாரியம்மன்</h1>
          <p style="font-size: 13px; font-weight: 600; color: rgba(253,230,138,0.9); margin: 4px 0 0 0;">ஆனங்கூர் சீட்டு குழு • Chit #08</p>
          <div style="width: 180px; height: 6px; background: rgba(30,10,14,0.9); border-radius: 9999px; overflow: hidden; margin-top: 32px; border: 1px solid rgba(245,158,11,0.3);">
            <div style="width: 50%; height: 100%; background: linear-gradient(90deg, #7A121D, #F59E0B, #921623); border-radius: 9999px; animation: initial-progress 1.6s ease-in-out infinite;"></div>
          </div>
          <p id="app-init-status" style="font-size: 11px; font-weight: 600; color: #FDE68A; opacity: 0.8; margin-top: 14px; letter-spacing: 0.02em;">ஸ்ரீ பட்டணத்து மாரியம்மன் அருள்...</p>
          <div id="init-recovery-actions" style="display: none; margin-top: 16px; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
            <p style="font-size: 11px; color: #F59E0B; font-weight: 600; margin: 0 0 6px 0;">இணைப்பு நேரம் எடுக்கிறது (Slow network)</p>
            <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
              <button onclick="window.location.reload()" style="padding: 7px 14px; border-radius: 8px; background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.25); font-size: 11px; font-weight: 700; cursor: pointer;">🔄 மீண்டும் புதுப்பிக்கவும் (Reload)</button>
              <button onclick="localStorage.clear(); window.location.reload()" style="padding: 7px 14px; border-radius: 8px; background: #7A121D; color: #FDE68A; border: 1px solid #D97706; font-size: 11px; font-weight: 700; cursor: pointer;">🚪 நேரடி உள்நுழைவு (Go to Login)</button>
            </div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 12px;">
          <span style="font-size: 11px; font-weight: 700; color: #FDE68A; opacity: 0.75;">🔐 256-Bit SSL Encrypted Ledger</span>
          <span style="font-size: 10px; color: #A38C92;">Official Community App • All Rights Reserved © 2026</span>
        </div>
      </div>
      <style>
        @keyframes initial-progress {
          0% { transform: translateX(-100%); }
          50% { transform: translateX(35%); }
          100% { transform: translateX(100%); }
        }
      </style>
    </div>
    <script>
      // Fallback watchdog: only triggers if initial root static HTML remains unmounted for 10 seconds
      setTimeout(() => {
        const recovery = document.getElementById('init-recovery-actions');
        if (recovery) {
          recovery.style.display = 'flex';
        }
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
