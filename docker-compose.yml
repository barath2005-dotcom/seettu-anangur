version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: seettu-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: seettu_secure_password_2026
      POSTGRES_DB: seettu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: seettu-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:seettu_secure_password_2026@postgres:5432/seettu_db?schema=public
      JWT_SECRET: super-secret-production-seettu-jwt-key-2026
      JWT_REFRESH_SECRET: super-secret-production-refresh-jwt-key-2026
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: seettu-web
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
